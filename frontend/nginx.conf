# Serves the built frontend and proxies /api to the backend on the same origin, so the HttpOnly login cookie
# (SameSite=Strict) and the readable XSRF-TOKEN cookie work without CORS. Actuator is not proxied.

log_format requests '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time rid=$request_id';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout requests;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads are limited to 512 KB by the backend.
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8080;
        # The original host (with port), so the backend sees requests as same-origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same id in the Nginx access log and in the backend logs (RequestIdFilter).
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html, which is never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
