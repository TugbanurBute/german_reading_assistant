# Serves the built frontend and proxies /api to the backend on the same origin, so the HttpOnly login cookie
# (SameSite=Strict) and the readable XSRF-TOKEN cookie work without CORS. Actuator is not proxied.

log_format requests '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time rid=$request_id';

# The client address. On a server, an HTTPS proxy on the same machine (e.g. Caddy) connects through Docker's
# port mapping, so it arrives from a private or loopback address and its X-Forwarded-For is believed; the rightmost
# address not from those ranges is the client. A client connecting directly from the internet is never in these
# ranges, so whatever X-Forwarded-For it sends is ignored.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from ::1;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout requests;
    server_tokens off;

    # Browsers only honour HSTS on HTTPS responses, so this is harmless on http://localhost.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads are limited to 512 KB by the backend.
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8080;
        # The original host (with port), so the backend sees requests as same-origin.
        proxy_set_header Host $http_host;
        # Overwritten, never passed on from the client: the backend's login limits count per X-Real-IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same id in the Nginx access log and in the backend logs (RequestIdFilter).
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html, which is never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
