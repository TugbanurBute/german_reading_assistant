spring:
  application:
    name: german-reader
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: simple
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
    admin:
      operation-timeout: 5s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short, so an unreachable Redis costs a translation at most half a second (then fail-open).
      timeout: 500ms
      connect-timeout: 500ms
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # .txt uploads to the reading library; the service also limits the decoded text to 100,000 characters.
      max-file-size: 512KB
      max-request-size: 600KB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    # HMAC key for signing login tokens, at least 32 bytes. Required outside the local profile.
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${AUTH_TOKEN_TTL:8h}
    # Secure cookies need HTTPS; only the local profile turns this off.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  rate-limit:
    translations:
      # Per user, fixed window: at most `limit` translation requests per `window`.
      enabled: ${TRANSLATION_RATE_LIMIT_ENABLED:true}
      limit: ${TRANSLATION_RATE_LIMIT:10}
      window: ${TRANSLATION_RATE_WINDOW:60s}
    auth:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      login-limit: ${LOGIN_RATE_LIMIT:10}
      login-window: ${LOGIN_RATE_WINDOW:5m}
      register-limit: ${REGISTER_RATE_LIMIT:5}
      register-window: ${REGISTER_RATE_WINDOW:1h}
      client-ip-header: ${CLIENT_IP_HEADER:}
  quota:
    enabled: ${QUOTAS_ENABLED:true}
    translations-per-user-per-day: ${TRANSLATION_DAILY_LIMIT:200}
    provider-calls-per-day: ${GEMINI_DAILY_CALL_LIMIT:500}
  vocabulary-events:
    # false: no events are published or consumed; statistics stay as they are.
    enabled: ${VOCABULARY_EVENTS_ENABLED:true}
    relay-interval: PT2S
  analytics:
    # The time zone that decides which day a saved word counts for, and what "today" is.
    time-zone: ${ANALYTICS_TIME_ZONE:UTC}
  document-processing:
    # false: no messages are published or consumed; documents stay PENDING (reading is unaffected).
    enabled: ${DOCUMENT_PROCESSING_ENABLED:true}
    relay-interval: PT2S

translation:
  provider: ${TRANSLATION_PROVIDER}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:}
    timeout: ${GEMINI_TIMEOUT:15s}
    # true: ask Google once at startup whether GEMINI_MODEL exists (logged, never stops the app)
    verify-model: ${GEMINI_VERIFY_MODEL:false}
