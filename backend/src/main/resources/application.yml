spring:
  application:
    name: german-reader
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # .txt uploads to the reading library; the service also limits the decoded text to 100,000 characters.
      max-file-size: 512KB
      max-request-size: 600KB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    # HMAC key for signing login tokens, at least 32 bytes. Required outside the local profile.
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${AUTH_TOKEN_TTL:8h}
    # Secure cookies need HTTPS; only the local profile turns this off.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}

translation:
  provider: ${TRANSLATION_PROVIDER}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:}
    timeout: ${GEMINI_TIMEOUT:15s}
    # true: ask Google once at startup whether GEMINI_MODEL exists (logged, never stops the app)
    verify-model: ${GEMINI_VERIFY_MODEL:false}
