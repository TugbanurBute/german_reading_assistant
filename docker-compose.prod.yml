name: germanreader

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?FRONTEND_PORT must be set in .env}:8080"
    networks: [edge]
    mem_limit: 64m
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    networks: [edge, data]
    mem_limit: 768m
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m -Xss512k"
      SERVER_TOMCAT_THREADS_MAX: 50
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN must be set in .env (https://...)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (at least 32 characters)}
      AUTH_COOKIE_SECURE: "true"
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:?TRANSLATION_PROVIDER must be set in .env (gemini or mock)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANALYTICS_TIME_ZONE: ${ANALYTICS_TIME_ZONE:-UTC}
      CLIENT_IP_HEADER: X-Real-IP
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-5m}
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-5}
      REGISTER_RATE_WINDOW: ${REGISTER_RATE_WINDOW:-1h}
      TRANSLATION_DAILY_LIMIT: ${TRANSLATION_DAILY_LIMIT:-200}
      GEMINI_DAILY_CALL_LIMIT: ${GEMINI_DAILY_CALL_LIMIT:-500}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [data]
    mem_limit: 256m
    shm_size: 64m
    logging: *logging
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "effective_cache_size=128MB",
              "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [data]
    mem_limit: 96m
    logging: *logging
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1-alpine
    hostname: rabbitmq
    restart: unless-stopped
    networks: [data]
    mem_limit: 320m
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    networks: [data]
    mem_limit: 640m
    logging: *logging
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9092"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  rabbitmq-data:
  kafka-data:
